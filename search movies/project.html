<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineScope - Movie Search</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<!-- external css -->
<link rel="stylesheet" href="project.css">

</head>

<body>

<h1 class="hero-title">🎬 CineScope</h1>
<p class="subtitle">Search. Discover. Experience Cinema.</p>

<div class="search-wrapper">
    <div class="search-box d-flex">
        <input type="text" class="form-control" placeholder="Search your favorite movie..." id="input">
        <button class="btn btn-search" id="search">Search</button>
    </div>
</div>

<div id="box" style="display:none;" class="custom-message"></div>

<div class="container mt-5">
    <div class="row g-4" id="output">
        <!-- Movies will appear here -->
    </div>
</div>

<div class="empty-state">
🔍 Start searching to see movie results...
</div>

<footer>
&copy; 2024 CineScope. All rights reserved.
</footer>

<!-- JS -->
<script src="project.js"></script>

</body>
</html>
